<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferência BMP - Online & Compartilhada</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- PapaParse para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Html5-Qrcode para leitura de QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased" x-data="app()">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-base">Conferência BMP</h1>
                <p class="text-[10px] text-indigo-200">Modo Online / Nuvem</p>
            </div>
            <span class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full font-medium" x-text="items.length + ' Itens'"></span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 pb-24">

        <!-- Indicador de Carregamento da Nuvem -->
        <div x-show="loading" class="text-center py-12 text-slate-500 text-xs">
            Conectando ao banco de dados em nuvem...
        </div>

        <!-- 1. Tela de Upload Inicial (Caso a tabela esteja vazia) -->
        <template x-if="!loading && items.length === 0">
            <div class="bg-white rounded-xl shadow-sm p-6 text-center space-y-4 mt-6">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl">☁️</div>
                <h2 class="font-semibold text-lg">Inicializar Conferência</h2>
                <p class="text-xs text-slate-500">O banco de dados está vazio. Faça o upload do CSV (`lista_patrimonio_tnav.csv`) <b>apenas uma vez</b> para registrar os itens na nuvem.</p>
                
                <label class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg cursor-pointer text-sm transition">
                    <span x-text="uploading ? 'Enviando para Nuvem...' : 'Selecionar e Enviar CSV'"></span>
                    <input type="file" accept=".csv" @change="handleFileUpload($event)" class="hidden" :disabled="uploading">
                </label>
            </div>
        </template>

        <!-- 2. Painel de Controle e Abas (Dados Carregados) -->
        <template x-if="!loading && items.length > 0">
            <div class="space-y-4">

                <!-- Ações Rápidas & Busca -->
                <div class="bg-white p-3 rounded-xl shadow-sm space-y-3">
                    <div class="flex gap-2">
                        <input type="text" x-model="searchQuery" placeholder="Buscar por Número BMP ou Descrição..." class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
                        <button @click="startQrScanner()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-center shrink-0">
                            📷 QR Code
                        </button>
                    </div>

                    <!-- Abas de Filtro / Extratos -->
                    <div class="grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-lg text-center text-xs font-medium">
                        <button @click="activeTab = 'nao_encontrado'" :class="activeTab === 'nao_encontrado' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'" class="py-1.5 rounded-md transition">Não Encl.</button>
                        <button @click="activeTab = 'encontrado'" :class="activeTab === 'encontrado' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'" class="py-1.5 rounded-md transition">Encontrados</button>
                        <button @click="activeTab = 'descarregar'" :class="activeTab === 'descarregar' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'" class="py-1.5 rounded-md transition">Descarga</button>
                        <button @click="activeTab = 'movimentado'" :class="activeTab === 'movimentado' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'" class="py-1.5 rounded-md transition">Movimento</button>
                    </div>
                </div>

                <!-- Leitor de QR Code -->
                <div x-show="showScanner" class="bg-black rounded-xl overflow-hidden p-2 relative">
                    <div id="reader" class="w-full"></div>
                    <button @click="stopQrScanner()" class="mt-2 w-full bg-red-600 text-white text-xs py-2 rounded-lg font-medium">Fechar Câmera</button>
                </div>

                <!-- Lista de Itens Filtrados -->
                <div class="space-y-2.5">
                    <template x-for="item in filteredItems" :key="item.id_patrimonio">
                        <div @click="openDetail(item)" class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 active:scale-[0.99] transition cursor-pointer flex flex-col gap-1.5">
                            <div class="flex justify-between items-start">
                                <span class="font-bold text-xs text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" x-text="'BMP: ' + item.id_patrimonio"></span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold uppercase"
                                    :class="{
                                        'bg-amber-100 text-amber-700': item.status === 'nao_encontrado',
                                        'bg-emerald-100 text-emerald-700': item.status === 'encontrado',
                                        'bg-blue-100 text-blue-700': item.status === 'descarregar',
                                        'bg-purple-100 text-purple-700': item.status === 'movimentado'
                                    }"
                                    x-text="formatStatus(item.status)">
                                </span>
                            </div>
                            <p class="text-xs font-medium text-slate-700 line-clamp-2" x-text="item.descricao"></p>
                            <div class="text-[11px] text-slate-400 flex justify-between pt-1 border-t border-slate-50">
                                <span x-text="'Setor: ' + (item.unidade_setor || 'N/D')"></span>
                                <span x-text="'Dep: ' + (item.dependencia || 'N/D')"></span>
                            </div>
                        </div>
                    </template>

                    <template x-if="filteredItems.length === 0">
                        <div class="text-center py-10 text-slate-400 text-xs">
                            Nenhum item encontrado nesta categoria.
                        </div>
                    </template>
                </div>

                <!-- Opções de Exportar / Sincronizar -->
                <div class="pt-4 flex gap-2">
                    <button @click="exportCSV()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium py-2.5 rounded-lg transition">Exportar Relatório CSV</button>
                    <button @click="loadFromSupabase()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium px-4 py-2.5 rounded-lg transition" title="Atualizar dados da nuvem">🔄</button>
                </div>

            </div>
        </template>

        <!-- 3. Modal de Detalhes / Edição de Item -->
        <template x-if="selectedItem">
            <div class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
                    <div class="flex justify-between items-center border-b pb-3">
                        <div>
                            <h3 class="font-bold text-sm text-indigo-600" x-text="'Número BMP: ' + selectedItem.id_patrimonio"></h3>
                            <p class="text-[10px] text-slate-400" x-text="(selectedItem.unidade_setor || 'N/D') + ' / ' + (selectedItem.dependencia || 'N/D')"></p>
                        </div>
                        <button @click="selectedItem = null" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição do Bem</label>
                        <p class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100" x-text="selectedItem.descricao"></p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Status da Conferência</label>
                        <select x-model="selectedItem.status" class="w-full text-xs border border-slate-200 rounded-lg p-2.5 bg-white focus:outline-none focus:border-indigo-500 font-medium">
                            <option value="nao_encontrado">Não Encontrado</option>
                            <option value="encontrado">Encontrado</option>
                            <option value="descarregar">Para Descarga</option>
                            <option value="movimentado">Para Movimentação</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Detalhes / Observações</label>
                        <textarea x-model="selectedItem.detalhes" rows="3" placeholder="Insira detalhes ou observações..." class="w-full text-xs border border-slate-200 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button @click="saveSelectedItem()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium py-2.5 rounded-lg transition">Salvar na Nuvem</button>
                        <button @click="selectedItem = null" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium py-2.5 rounded-lg transition">Cancelar</button>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <!-- Configuração e Conexão Supabase -->
    <script>
        // Substitua pelas suas credenciais do projeto Supabase (Configurações > API)
        const SUPABASE_URL = 'https://fjyptnizrewasterynhu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqeXB0bml6cmV3YXN0ZXJ5bmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwOTQ0NTEsImV4cCI6MjEwNDY3MDQ1MX0.6ugJWkqM0rNInfMSz_qrAs8Xj7IRT6VzFG-_b2F3peo';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function app() {
            return {
                items: [],
                loading: true,
                uploading: false,
                activeTab: 'nao_encontrado',
                searchQuery: '',
                selectedItem: null,
                showScanner: false,
                html5QrCode: null,

                init() {
                    this.loadFromSupabase();
                },

                async loadFromSupabase() {
                    this.loading = true;
                    const { data, error } = await supabaseClient
                        .from('conferencia_bmp')
                        .select('*')
                        .order('id_patrimonio', { ascending: true });

                    if (!error) {
                        this.items = data || [];
                    } else {
                        alert('Erro ao carregar dados da nuvem: ' + error.message);
                    }
                    this.loading = false;
                },

                async handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    this.uploading = true;

                    Papa.parse(file, {
                        header: true,
                        skipEmptyLines: true,
                        complete: async (results) => {
                            const newRecords = results.data.map(row => ({
                                id_patrimonio: String(row.idPatrimonio || '').trim(),
                                dependencia: String(row.dependencia || '').trim(),
                                unidade_setor: String(row.unidadeSetor || '').trim(),
                                descricao: String(row.descricao || '').trim(),
                                status: 'nao_encontrado',
                                detalhes: ''
                            })).filter(item => item.id_patrimonio !== '');

                            // Envia em lotes para o Supabase
                            const { error } = await supabaseClient
                                .from('conferencia_bmp')
                                .upsert(newRecords, { onConflict: 'id_patrimonio' });

                            this.uploading = false;

                            if (error) {
                                alert('Erro ao salvar no Supabase: ' + error.message);
                            } else {
                                alert(`Sucesso! ${newRecords.length} itens cadastrados na nuvem.`);
                                this.loadFromSupabase();
                            }
                        },
                        error: (err) => {
                            this.uploading = false;
                            alert('Erro ao ler CSV: ' + err.message);
                        }
                    });
                },

                get filteredItems() {
                    return this.items.filter(item => {
                        const matchTab = item.status === this.activeTab;
                        const q = this.searchQuery.toLowerCase();
                        const matchQuery = !q || item.id_patrimonio.toLowerCase().includes(q) || item.descricao.toLowerCase().includes(q);
                        return matchTab && matchQuery;
                    });
                },

                formatStatus(status) {
                    const map = {
                        'nao_encontrado': 'Não Encontrado',
                        'encontrado': 'Encontrado',
                        'descarregar': 'Descarga',
                        'movimentado': 'Movimentado'
                    };
                    return map[status] || status;
                },

                openDetail(item) {
                    this.selectedItem = { ...item };
                },

                async saveSelectedItem() {
                    const { error } = await supabaseClient
                        .from('conferencia_bmp')
                        .update({
                            status: this.selectedItem.status,
                            detalhes: this.selectedItem.detalhes,
                            updated_at: new Date()
                        })
                        .eq('id_patrimonio', this.selectedItem.id_patrimonio);

                    if (error) {
                        alert('Erro ao atualizar: ' + error.message);
                    } else {
                        // Atualiza localmente
                        const index = this.items.findIndex(i => i.id_patrimonio === this.selectedItem.id_patrimonio);
                        if (index !== -1) {
                            this.items[index] = { ...this.selectedItem };
                        }
                        this.selectedItem = null;
                    }
                },

                exportCSV() {
                    const csvData = this.items.map(i => ({
                        idPatrimonio: i.id_patrimonio,
                        dependencia: i.dependencia,
                        unidadeSetor: i.unidade_setor,
                        descricao: i.descricao,
                        status: i.status,
                        detalhes: i.detalhes
                    }));
                    const csv = Papa.unparse(csvData);
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.setAttribute('href', url);
                    link.setAttribute('download', 'relatorio_conferencia_nuvem.csv');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                },

                startQrScanner() {
                    this.showScanner = true;
                    setTimeout(() => {
                        this.html5QrCode = new Html5Qrcode("reader");
                        this.html5QrCode.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            (decodedText) => {
                                const cleanText = decodedText.trim();
                                this.stopQrScanner();

                                const found = this.items.find(i => i.id_patrimonio === cleanText);

                                if (found) {
                                    this.openDetail(found);
                                    if (this.selectedItem.status === 'nao_encontrado') {
                                        this.selectedItem.status = 'encontrado';
                                    }
                                } else {
                                    alert(`Atenção: O Número BMP "${cleanText}" não está na lista da conferência.`);
                                }
                            },
                            (errorMessage) => {}
                        ).catch(err => {
                            alert("Erro ao acessar a câmera: " + err);
                            this.showScanner = false;
                        });
                    }, 300);
                },

                stopQrScanner() {
                    if (this.html5QrCode) {
                        this.html5QrCode.stop().then(() => {
                            this.html5QrCode.clear();
                            this.showScanner = false;
                        }).catch(() => {
                            this.showScanner = false;
                        });
                    } else {
                        this.showScanner = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
