<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- _includes/head.html -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Controle | Conferência BMP</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS Customizado -->
<link rel="stylesheet" href="/assets/css/layout.css">

<!-- Supabase Client v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Credenciais Públicas do Supabase -->
<script src="/assets/js/config.js"></script>
</head>
<body>

    <!-- _includes/sidebar.html -->
<aside id="sidebarWrapper" class="d-flex flex-column p-2 text-white">
    <!-- Marca / Topo Sidebar -->
    <div class="sidebar-brand d-flex align-items-center gap-2 my-2 px-2 text-nowrap overflow-hidden">
        <span class="fs-4 sidebar-icon">📦</span>
        <span class="fs-5 fw-bold tracking-wide sidebar-label">Conferência BMP</span>
    </div>
    <hr class="text-secondary my-2">

    <!-- Container onde o layout.js injetará os botões autorizados -->
    <nav id="sidebarNav" class="nav flex-column gap-1 mb-auto">
        <div class="text-secondary small px-2 sidebar-label">Carregando permissões...</div>
    </nav>
</aside>

    <div id="page-content-wrapper">
        <!-- _includes/header.html -->
<header class="navbar navbar-expand bg-white border-bottom shadow-sm px-3 sticky-top">
    <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
        
        <!-- Esquerda: Botão de controle da barra lateral + Título da Página -->
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-secondary btn-sm d-flex align-items-center justify-content-center" 
                    id="sidebarToggle" 
                    type="button" 
                    title="Alternar Menu Lateral"
                    style="width: 36px; height: 36px;">
                <span class="fs-6">☰</span>
            </button>
            <h5 class="mb-0 fw-semibold text-dark text-truncate">Painel de Controle</h5>
        </div>

        <!-- Direita: Menu Suspenso (Dropdown) do Usuário -->
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2 py-1 px-2 border" 
                    type="button" 
                    id="userDropdown" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false">
                <span class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center" 
                      style="width: 28px; height: 28px; font-size: 0.8rem;">👤</span>
                <span id="navbarUserName" class="text-dark small fw-medium">Verificando...</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 small" href="/perfil.html">
                        <span>⚙️</span> <span>Meu Perfil</span>
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <button class="dropdown-item d-flex align-items-center gap-2 small text-danger" type="button" id="btnLogout">
                        <span>🚪</span> <span>Encerrar Sessão</span>
                    </button>
                </li>
            </ul>
        </div>

    </div>
</header>

        <main class="container-fluid p-4 flex-grow-1">
            <div class="row g-3">
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm p-3 bg-white rounded-3">
            <div class="text-muted small fw-bold text-uppercase">Conferências Abertas</div>
            <h3 class="fw-bold text-dark mt-2 mb-0" id="cardConferencias">-</h3>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm p-3 bg-white rounded-3">
            <div class="text-muted small fw-bold text-uppercase">Total de Itens BMP</div>
            <h3 class="fw-bold text-primary mt-2 mb-0" id="cardItens">-</h3>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm p-3 bg-white rounded-3">
            <div class="text-muted small fw-bold text-uppercase">Itens Não Conferidos</div>
            <h3 class="fw-bold text-warning mt-2 mb-0" id="cardPendentes">-</h3>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm mt-4 p-4 rounded-3 bg-white">
    <h6 class="fw-bold text-dark mb-3">Ações Rápidas</h6>
    <div class="d-flex flex-wrap gap-2">
        <a href="/conferencia.html" class="btn btn-primary px-3 py-2">Realizar Conferência</a>
        <a href="/relatorios.html" class="btn btn-outline-secondary px-3 py-2">Consultar Relatórios</a>
    </div>
</div>
        </main>

        <!-- _includes/footer.html -->
<footer class="bg-white border-top text-center py-3 text-muted small mt-auto">
    <span>&copy; 2026 Sistema de Conferência de Material Carga - BMP.</span>
</footer>
    </div>

    <!-- Bootstrap 5 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Validador de Sessão e Renderizador RBAC -->
    <script src="/assets/js/layout.js"></script>
</body>
</html>
