<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação - Conferência de Material Carga</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilo Customizado de Login -->
    <link rel="stylesheet" href="assets/css/auth.css">

    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Configurações do Supabase -->
    <script src="assets/js/config.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card login-card shadow-sm border-0 w-100 p-3 p-sm-4 bg-white">
        <div class="card-body">
            <!-- Cabeçalho -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-light text-primary rounded-circle mb-2" style="width: 54px; height: 54px; font-size: 1.5rem;">
                    📦
                </div>
                <h4 class="fw-bold text-dark mb-1">Conferência de Material Carga</h4>
                <p class="text-muted small mb-0">Acesso restrito a operadores autorizados</p>
            </div>

            <!-- Alerta de Erro -->
            <div id="alertError" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

            <!-- Formulário de Login -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-secondary">E-mail institucional</label>
                    <input type="email" class="form-control" id="email" placeholder="operador@exemplo.com" required autocomplete="username">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-secondary">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" id="btnSubmit" class="btn btn-primary py-2 fw-semibold">
                        <span id="btnText">Entrar</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de Autenticação -->
    <script src="assets/js/auth.js"></script>
</body>
</html>
