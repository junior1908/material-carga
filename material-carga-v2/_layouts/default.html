<!-- _layouts/default.html -->

<html lang="pt-BR">

</head>
<body>

    {% include sidebar.html %}

    <div id="page-content-wrapper">
        {% include header.html %}

        <main class="container-fluid p-4 flex-grow-1">
            {{ content }}

    <!-- Validador de Sessão e Renderizador RBAC -->
    <script src="{{ '/assets/js/layout.js' | relative_url }}"></script>
</body>
</html>
